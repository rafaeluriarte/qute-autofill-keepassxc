<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Cadastro</title></head>
<body>
<h1>Cadastro</h1>
<form id="cadastro">
  <label for="nome">Nome completo</label>
  <input id="nome" name="nome" type="text">

  <label for="cpf">CPF</label>
  <input id="cpf" name="cpf" type="text">

  <label for="cep">CEP</label>
  <input id="cep" name="cep" type="text" maxlength="9">

  <label for="logradouro">Logradouro</label>
  <input id="logradouro" name="logradouro" type="text">

  <label for="numero">Numero</label>
  <input id="numero" name="numero" type="text">

  <label for="complemento">Complemento</label>
  <input id="complemento" name="complemento" type="text">

  <label for="bairro">Bairro</label>
  <input id="bairro" name="bairro" type="text">

  <label for="cidade">Cidade</label>
  <input id="cidade" name="cidade" type="text">

  <label for="uf">UF</label>
  <select id="uf" name="uf">
    <option value="">Selecione</option>
    <option value="SP">Sao Paulo</option>
    <option value="RJ">Rio de Janeiro</option>
    <option value="MG">Minas Gerais</option>
  </select>

  <!-- decoy: must not be treated as an apelido/family_name (BR meaning = nickname) -->
  <label for="apelido">Apelido (como quer ser chamado)</label>
  <input id="apelido" name="apelido" type="text">
</form>
</body>
</html>
