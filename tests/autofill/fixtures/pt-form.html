<!DOCTYPE html>
<html lang="pt-PT">
<head><meta charset="utf-8"><title>Registo</title></head>
<body>
<h1>Formulario de registo</h1>
<form id="registo">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" type="text">

  <label for="apelido">Apelido</label>
  <input id="apelido" name="apelido" type="text">

  <label for="email">E-mail</label>
  <input id="email" name="email" type="email">

  <label for="tel">Telemovel</label>
  <input id="tel" name="telemovel" type="tel">

  <label for="morada">Morada</label>
  <input id="morada" name="morada" type="text">

  <label for="cp">Codigo postal</label>
  <input id="cp" name="codigo_postal" type="text" maxlength="8">

  <label for="loc">Localidade</label>
  <input id="loc" name="localidade" type="text">

  <label for="nif">NIF</label>
  <input id="nif" name="nif" type="text">
</form>
</body>
</html>
