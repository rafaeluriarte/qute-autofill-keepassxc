<!doctype html>
<html>
<body>
<form id="changepw">
  <input type="password" name="current" autocomplete="current-password" id="current-pw" value="should-not-be-touched">
  <input type="password" name="new" autocomplete="new-password" minlength="10" maxlength="24" id="new-pw">
  <input type="password" name="confirm" autocomplete="new-password" minlength="10" maxlength="24" id="confirm-pw">
  <button type="submit">Change password</button>
</form>
</body>
</html>
