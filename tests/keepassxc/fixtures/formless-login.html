<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form-less SPA login</title></head>
<body>
  <main id="login-panel">
    <label>Email <input type="text" placeholder="email" autocomplete="off"></label>
    <label>Password <input type="password" placeholder="password" autocomplete="off"></label>
    <button id="login-button" type="button">Login</button>
  </main>
  <script>
  document.getElementById('login-button').addEventListener('click', function () {
    document.body.dataset.submitted = 'yes';
  });
  </script>
</body>
</html>
